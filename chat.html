<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profit AI Chat</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
}

header{
    background:#FFD700;
    color:black;
    padding:15px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

#chat{
    height:65vh;
    overflow-y:auto;
    padding:15px;
}

.user{
    background:#FFD700;
    color:black;
    padding:10px;
    border-radius:10px;
    margin:10px 0;
    text-align:right;
}

.bot{
    background:#333;
    padding:10px;
    border-radius:10px;
    margin:10px 0;
}

.bottom{
    position:fixed;
    bottom:0;
    width:100%;
    display:flex;
    background:#222;
}

input{
    flex:1;
    padding:15px;
    border:none;
    font-size:16px;
}

button{
    background:#FFD700;
    border:none;
    padding:15px 20px;
    font-weight:bold;
}
</style>
</head>

<body>

<header>🤖 Profit AI Chat</header>

<div id="chat"></div>

<div class="bottom">
<input id="msg" placeholder="Ask anything...">
<button onclick="send()">Send</button>
</div>

<script src="script.js"></script>

</body>
</html>
