<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profit AI Chat</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
    padding-bottom:80px;
}

header{
    background:#FFD700;
    color:black;
    padding:15px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

#chat{
    height:calc(100vh - 140px);
    overflow-y:auto;
    padding:15px;
}

.user{
    background:#FFD700;
    color:black;
    padding:10px;
    border-radius:10px;
    margin:10px 0;
    text-align:right;
}

.bot{
    background:#333;
    padding:10px;
    border-radius:10px;
    margin:10px 0;
}

.bottom{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    display:flex;
    padding:10px;
    box-sizing:border-box;
    background:#222;
}
    
input{
    flex:1;
    padding:14px;
    border:none;
    border-radius:12px;
    outline:none;
    font-size:16px;
    }

button{
    background:#FFD700;
    color:black;
    border:none;
    border-radius:12px;
    margin-left:10px;
    padding:14px 22px;
    cursor:pointer;
    font-weight:bold;
}
</style>
</head>

<body>

<header>🤖 Profit AI Chat</header>

<div class="bottom">
    <button id="voiceBtn" title="Voice">🎤</button>

    <input
        id="msg"
        type="text"
        placeholder="Ask Profit AI anything..."
        autocomplete="off"
    >

    <button id="uploadBtn" title="Upload">📎</button>

    <button onclick="send()">➤</button>
</div>
<script>
document.getElementById("msg").addEventListener("keypress", function(e){
    if(e.key==="Enter"){
        send();
    }
});
</script>
<input type="file" id="fileInput" hidden>
<script type="module" src="script.js"></script>

</body>
</html>
