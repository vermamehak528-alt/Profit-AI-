<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profit AI Chat</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
    padding-bottom:80px;
}

header{
    background:#FFD700;
    color:black;
    padding:15px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

#chat{
    height:calc(100vh - 140px);
    overflow-y:auto;
    padding:15px;
    display:flex;
    flex-direction:column;
}

.user{
    background:#FFD700;
    color:#000;
    padding:12px 16px;
    border-radius:18px 18px 0 18px;
    margin:10px 0;
    max-width:75%;
    width:fit-content;
    margin-left:auto;
    word-wrap:break-word;
}

.bot{
    background:#2b2b2b;
    color:#fff;
    padding:12px 16px;
    border-radius:18px 18px 18px 0;
    margin:10px 0;
    max-width:75%;
    width:fit-content;
    word-wrap:break-word;
}

    .bottom{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    display:flex;
    align-items:center;
    gap:6px;
    padding:8px;
    background:#222;
    box-sizing:border-box;
    }

input{
    flex:1;
    min-width:0;
    padding:12px;
    font-size:16px;
    border:none;
    border-radius:12px;
    outline:none;
}

button{
    width:42px;
    height:42px;
    padding:0;
    border:none;
    border-radius:10px;
    background:#FFD700;
    color:#000;
    font-size:20px;
    font-weight:bold;
    margin:0;
    flex-shrink:0;
}
</style>
</head>

<body>

<header>🤖 Profit AI Chat</header>
<div id="chat"></div>
<div class="bottom">
    <button id="voiceBtn" title="Voice">🎤</button>

    <input
        id="msg"
        type="text"
        placeholder="Ask Profit AI anything..."
        autocomplete="off"
    >

    <button id="uploadBtn" title="Upload">📎</button>

    <button id="sendBtn" type="button">➤</button>
</div>
<input type="file" id="fileInput" hidden>
<script type="module" src="script.js"></script>

</body>
</html>
