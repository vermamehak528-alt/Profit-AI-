<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Profit AI</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
🤖 Profit AI Dashboard
</header>

<div class="login-container">

<h1>Welcome to Profit AI 🚀</h1>

<p id="userEmail">Loading...</p>

<br>

<a href="chat.html"><button>💬 AI Chat</button></a>

<br><br>

<a href="pricing.html"><button>💎 Upgrade Plan</button></a>

<br><br>

<a href="contact.html"><button>📞 Contact Support</button></a>

<br><br>

<a href="settings.html"><button>⚙️ Settings</button></a>

<br><br>

<button onclick="logout()">🚪 Logout</button>

</div>

<script type="module">
import { auth } from "./firebase.js";
import {
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById("userEmail").innerHTML =
      "Logged in as: <b>" + user.email + "</b>";
  } else {
    window.location.href = "login.html";
  }
});

window.logout = function () {
  signOut(auth).then(() => {
    window.location.href = "login.html";
  });
};
</script>

</body>
</html>
